<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kindle Highlights</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="title">Kindle <span>Highlights</span></div>
  <div class="actions">
    <button id="btnSync" class="btn-primary">↻ Sincronizar biblioteca</button>
    <button id="btnLibrary">Abrir biblioteca</button>
    <button id="btnFullSync" class="btn-link" title="Vuelve a descargar todos los libros, aunque no tengan cambios">Forzar sincronización completa</button>
  </div>
  <div id="status" class="status"></div>
  <p class="hint">La sincronización usa tu sesión de <b>read.amazon.com/notebook</b>. Si no hay ninguna pestaña abierta, se abrirá una.</p>
  <script src="popup.js"></script>
</body>
</html>
